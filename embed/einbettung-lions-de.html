<!--
  Einbettung der Lions Social Wall auf kassel-herkules.lions.de

  Nur dieses iframe im Redaktionssystem von lions.de einfügen.
  "EURE-ORGANISATION" durch den Namen eurer GitHub-Organisation ersetzen
  (oder die ganze Adresse durch eure eigene, falls ihr eine eigene Domain eingerichtet habt).

  ?modus=seiten  -> die Wall passt sich in die feste Höhe ein und blättert
                    mit "Ältere / Neuere" (oder Wischen auf dem Handy).
  height="1000"  -> passt für 4 Reihen à 2 auf dem Handy und 3 Reihen à 4 am PC.
                    Andere Höhen funktionieren auch: Die Wall rechnet selbst aus,
                    wie viele Beiträge hineinpassen.
-->
<iframe src="https://EURE-ORGANISATION.github.io/lions-social-wall/?modus=seiten"
        title="Instagram-Beiträge des Lions Club Kassel-Herkules"
        width="100%" height="1000" frameborder="0" scrolling="no" loading="lazy"></iframe>
