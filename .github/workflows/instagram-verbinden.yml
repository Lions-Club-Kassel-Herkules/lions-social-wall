name: Instagram verbinden

# Einmalig bei der Einrichtung (und nur falls der Token je abläuft) manuell starten:
# Actions > Instagram verbinden > Run workflow > Code einfügen.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code aus der Adresszeile nach dem Instagram-Login (oder die ganze Adresse)"
        required: true

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Code gegen Token tauschen und im Tresor speichern
        env:
          IG_APP_ID: ${{ vars.IG_APP_ID }}
          IG_REDIRECT_URI: ${{ vars.IG_REDIRECT_URI }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_CODE: ${{ inputs.code }}
          GH_TOKEN: ${{ secrets.TRESOR_SCHLUESSEL }}
        run: |
          python3 scripts/connect_instagram.py "$RUNNER_TEMP/neu"
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/neu"
          shred -u "$RUNNER_TEMP/neu"
          echo "Fertig. Der Token liegt jetzt verschlüsselt im Secret IG_TOKEN."
